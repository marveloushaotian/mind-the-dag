name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compatibility:
    uses: ./.github/workflows/compatibility.yml
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Group library server (PocketBase on CSC Rahti, see server/)
          VITE_LIBRARY_URL: https://library-mind-the-dag.2.rahtiapp.fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: [build, compatibility]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for compatible library server
        timeout-minutes: 25
        shell: bash
        run: |
          for attempt in $(seq 1 96); do
            if curl --fail --silent --max-time 10 https://library-mind-the-dag.2.rahtiapp.fi/api/mtd/capabilities | jq -e '.mapRevisionWrites == 1 and .mapRecovery == 1 and .contentAwareSaving == 1' >/dev/null; then
              echo "The library server supports safe saving and recovery."
              exit 0
            fi
            echo "Waiting for the library server rollout ($attempt/96)."
            sleep 15
          done
          echo "The backend is not ready; keeping the current website online."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
