# mind-the-dag group library on CSC Rahti (project: mind-the-dag).
# Import in the Rahti web console (+ > Import YAML) or `oc apply -f rahti.yaml`.
#
# Updates deploy themselves: the ImageStream re-imports ghcr.io/...:latest on Rahti's
# schedule (about every 15 minutes), and the trigger on the Deployment rolls out each
# new image. CI publishes a new image whenever server/ changes on main.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: library-server
spec:
  lookupPolicy: { local: true }
  tags:
    - name: latest
      from: { kind: DockerImage, name: "ghcr.io/marveloushaotian/mind-the-dag-server:latest" }
      importPolicy: { scheduled: true }
      referencePolicy: { type: Source }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library
  labels: { app: library }
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"library-server:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"pocketbase\")].image"}]'
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: library }
  template:
    metadata:
      labels: { app: library }
    spec:
      containers:
        - name: pocketbase
          image: ghcr.io/marveloushaotian/mind-the-dag-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          env:
            - name: ORIGINS
              value: "https://marveloushaotian.github.io,http://localhost:5173,http://localhost:4173"
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }  # Rahti: CPU limit/request ratio <= 5
          readinessProbe:
            httpGet: { path: /api/health, port: 8090 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8090 }
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /pb_data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: library-data
---
apiVersion: v1
kind: Service
metadata:
  name: library
spec:
  selector: { app: library }
  ports:
    - port: 8090
      targetPort: 8090
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: library
spec:
  to: { kind: Service, name: library }
  port: { targetPort: 8090 }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
